[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "GPL-3.0-only",
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[advisories]
version = 2
ignore = []

[[licenses.clarify]]
crate = "focus-on-work-cli"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x65a1adbe }]

[[licenses.clarify]]
crate = "focus-on-work-core"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x65a1adbe }]

[[licenses.clarify]]
crate = "focus-on-work-daemon"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x65a1adbe }]

[[licenses.clarify]]
crate = "focus-on-work-gui"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x65a1adbe }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
