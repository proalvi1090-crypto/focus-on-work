[package]
name = "focus-on-work-cli"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

[[bin]]
name = "focus-on-work"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
focus-on-work-core = { path = "../focus-on-work-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
